[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis-mcp"
version = "5.0.0"
description = "PRAXIS-MCP - AI驱动的投研纪律系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "click>=8.0",
    "structlog>=24.0",
    "chinese_calendar>=1.8.0",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
baostock = ["baostock>=0.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
all = [
    "akshare>=1.14",
    "baostock>=0.8",
    "chinese_calendar>=1.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
praxis-mcp = "praxis.cli:main"

license = {text = "MIT"}
authors = [
    {name = "BoussinesqJ"}
]

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "slow: 需要网络或耗时较长的测试",
    "integration: 集成测试",
    "unit: 单元测试",
]

[tool.coverage.run]
source = ["src/praxis"]
omit = ["*/__pycache__/*", "*/tests/*"]
