[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis"
version = "4.0.0"
description = "PRAXIS - 投研纪律系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
baostock = ["baostock>=0.8"]
all = ["akshare>=1.14", "baostock>=0.8"]

[project.scripts]
praxis = "praxis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "slow: 需要网络或耗时较长的测试",
    "integration: 集成测试",
    "unit: 单元测试",
]

[tool.coverage.run]
source = ["praxis"]
omit = ["*/__pycache__/*", "*/tests/*", "praxis-r1.0/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
