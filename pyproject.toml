[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis"
version = "r1.1.0"
description = "PRAXIS - 投研纪律系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
akshare = ["akshare>=1.14"]
baostock = ["baostock>=0.8"]
all = ["akshare>=1.14", "baostock>=0.8"]

[project.scripts]
praxis = "praxis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]
